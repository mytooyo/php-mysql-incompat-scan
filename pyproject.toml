[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "php-mysql-incompat-scan"
dynamic = ["version"]
description = "Offline scanner that locates PHP 5.3->8.5 / MySQL 5.1->8.4 incompatibilities in source code, config files and design documents (stdlib only)"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
keywords = ["php", "mysql", "migration", "upgrade", "compatibility", "static-analysis", "legacy"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Natural Language :: Japanese",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Quality Assurance",
]
authors = [{ name = "mytooyo" }]
dependencies = []

[project.scripts]
incompat-scan = "incompat_scan:main"

[tool.setuptools]
py-modules = ["incompat_scan"]

[tool.setuptools.dynamic]
version = { attr = "incompat_scan.VERSION" }
